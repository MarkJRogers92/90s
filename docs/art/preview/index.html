<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DEAD MALL — art tree</title>
<style>
  :root { --zoom:2; --bg:#141318; --panel:#1d1b23; --line:#2f2c38; --ink:#e8e6ef;
          --dim:#9a95a8; --accent:#c9a227; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); display:flex;
         font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }

  /* ---------- sidebar ---------- */
  aside { width:310px; flex:0 0 310px; border-right:1px solid var(--line);
          background:var(--panel); overflow-y:auto; height:100vh; padding:12px 0 40px; }
  aside h1 { font-size:13px; letter-spacing:.1em; text-transform:uppercase;
             margin:0 14px 10px; }
  aside .meta { color:var(--dim); font-size:11px; margin:0 14px 14px; }
  .search { width:calc(100% - 28px); margin:0 14px 12px; background:#15141a; color:var(--ink);
            border:1px solid var(--line); border-radius:4px; padding:6px 8px; font:inherit; font-size:12px; }
  .search:focus { outline:none; border-color:#4a4658; }
  .dir { display:flex; justify-content:space-between; gap:8px; padding:3px 14px;
         cursor:pointer; color:var(--dim); font-size:12px; white-space:nowrap; }
  .dir:hover { background:#242230; color:var(--ink); }
  .dir.on { background:#2c2938; color:var(--ink); box-shadow:inset 2px 0 0 var(--accent); }
  .dir .n { color:#6d687d; font-size:11px; }
  .dir.feat { color:var(--accent); }
  .sec { color:#6d687d; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
         margin:14px 14px 4px; }

  /* ---------- main ---------- */
  main { flex:1; height:100vh; overflow-y:auto; }
  header { position:sticky; top:0; z-index:10; background:rgba(20,19,24,.95);
           backdrop-filter:blur(6px); border-bottom:1px solid var(--line);
           padding:10px 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  header .where { font-size:12px; color:var(--ink); }
  header .where b { color:var(--accent); }
  .sp { flex:1; }
  button { background:#242230; color:var(--ink); border:1px solid var(--line); border-radius:4px;
           padding:4px 10px; font:inherit; font-size:11px; cursor:pointer; }
  button:hover { border-color:#4a4658; }
  button.on { background:var(--ink); color:#141318; border-color:var(--ink); }
  .lbl { color:var(--dim); font-size:11px; }
  .grid { padding:14px 16px 80px; display:grid; gap:10px;
          grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:5px;
          padding:7px; text-align:center; }
  .cell { height:150px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  img { image-rendering:pixelated; image-rendering:crisp-edges;
        max-width:100%; max-height:100%; cursor:zoom-in; display:block; }
  .nm { font-size:10px; color:var(--ink); margin-top:5px; word-break:break-all; line-height:1.3; }
  .mt { font-size:10px; color:var(--dim); }
  .badge { color:#d9a44a; }
  .more { grid-column:1/-1; text-align:center; padding:16px; }
  .empty { color:var(--dim); padding:40px 16px; }

  /* ---------- lightbox ---------- */
  #lb { position:fixed; inset:0; background:rgba(8,8,11,.96); display:none;
        z-index:50; overflow:auto; }
  #lb.on { display:block; }
  #lb .wrap { min-height:100%; display:flex; flex-direction:column; align-items:center;
              justify-content:center; gap:10px; padding:24px; }
  #lb img { cursor:zoom-out; }
  #lb .cap { color:var(--dim); font-size:12px; text-align:center; }

  /* ---------- curated / featured ---------- */
  .feat { padding:14px 16px 80px; }
  .feat h2 { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim);
             margin:24px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line); }
  .feat h2:first-child { margin-top:0; }
  .prow { display:flex; gap:10px; overflow-x:auto; padding-bottom:8px; }
  .exprrow { display:grid; grid-template-columns:140px 1fr; gap:10px; align-items:center;
             border-top:1px solid var(--line); padding:10px 0; }
  .exprrow .nm2 { font-size:12px; }
  .exprrow .nm2 small { display:block; color:var(--dim); font-size:10px; }
  .cells { display:flex; gap:6px; overflow-x:auto; }
  .cellx { text-align:center; }
  .cellx .l { color:var(--dim); font-size:9px; text-transform:uppercase; letter-spacing:.05em; }
  .pal { display:flex; flex-wrap:wrap; gap:3px; }
  .pal i { width:22px; height:22px; border-radius:3px; border:1px solid rgba(255,255,255,.07); }
  .note { background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent);
          border-radius:5px; padding:10px 14px; font-size:11px; color:var(--dim); margin-top:16px; }
  .note b { color:var(--ink); }
  .note ul { margin:6px 0 0; padding-left:16px; }
</style>
</head>
<body>

<aside>
  <h1>DEAD MALL — art tree</h1>
  <div class="meta" id="meta">loading…</div>
  <input class="search" id="q" placeholder="filter by path…  (e.g. walk, snapped, mop)">
  <div id="dirs"></div>
</aside>

<main>
  <header>
    <span class="where" id="where"><b>Featured</b> — portraits</span>
    <span class="sp"></span>
    <span class="lbl">zoom</span>
    <button data-z="1">1×</button><button data-z="2" class="on">2×</button>
    <button data-z="3">3×</button><button data-z="4">4×</button><button data-z="6">6×</button>
    <span class="lbl" style="margin-left:8px">bg</span>
    <button data-bg="#141318" class="on">dark</button>
    <button data-bg="#4c4e4b">grey</button>
    <button data-bg="#ffffff">white</button>
  </header>
  <div id="view"></div>
</main>

<div id="lb"><div class="wrap"><img id="lbimg" alt=""><div class="cap" id="lbcap"></div></div></div>

<script>
const CHARS=["teenager","employee","security-guard","store-manager","stranger","survivor","vendor","corrupted-human"];
const LBL={teenager:"Teenager",employee:"Mall employee","security-guard":"Security guard",
           "store-manager":"Store manager",stranger:"Stranger",survivor:"Survivor",
           vendor:"Vendor","corrupted-human":"Corrupted human"};
const EXPRS=["neutral","determined","hurt","afraid","angry","surprised"];
const CHUNK=240;
let MAN=null, current="__featured__", shown=0, filtered=[];

const view=document.getElementById("view");
const where=document.getElementById("where");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* encode per path segment: a future file named "hanger idle (v2).png" would
   otherwise silently 404, and encodeURI alone still leaves # and ? broken */
const url=s=>s.split("/").map(encodeURIComponent).join("/");

/* ---------------- lightbox ---------------- */
const lb=document.getElementById("lb"), lbimg=document.getElementById("lbimg"), lbcap=document.getElementById("lbcap");
function openLB(src,cap){ lbimg.src=src; lbcap.textContent=cap; lb.classList.add("on"); }
lb.onclick=()=>{ lb.classList.remove("on"); lbimg.src=""; };

/* ---------------- featured view ---------------- */
function featured(){
  const base="../work/portraits";
  const pairs=CHARS.map(c=>`
    <div class="card" style="padding:10px">
      <div class="prow" style="justify-content:center;gap:12px">
        <div style="text-align:center"><img src="${base}/portrait-${c}.png" class="s160 z"
             style="width:calc(160px*var(--zoom));height:calc(160px*var(--zoom))"
             data-cap="${LBL[c]} — original 160x160"><div class="mt">original</div></div>
        <div style="text-align:center"><img src="${base}/out/portrait-${c}.png" class="s160 z"
             style="width:calc(160px*var(--zoom));height:calc(160px*var(--zoom))"
             data-cap="${LBL[c]} — finished 160x160 (palette-locked)"><div class="mt">finished</div></div>
      </div>
      <div class="nm" style="color:var(--ink);font-size:12px">${LBL[c]}</div>
    </div>`).join("");
  const rows=CHARS.map(c=>`
    <div class="exprrow">
      <div class="nm2">${LBL[c]}<small>work/portraits/expressions/${c}/</small></div>
      <div class="cells">${EXPRS.map(e=>`
        <div class="cellx"><img src="${base}/expressions/${c}/${e}.png"
          style="width:calc(96px*var(--zoom));height:calc(96px*var(--zoom))"
          data-cap="${LBL[c]} — ${e} (96x96)"><div class="l">${e}</div></div>`).join("")}</div>
    </div>`).join("");
  view.innerHTML=`<div class="feat">
    <h2>Detailed portraits — 160×160 · original vs finished</h2>
    <div class="grid" style="padding:0">${pairs}</div>
    <h2>Expression sets — 96×96 · six states each</h2>
    ${rows}
    <h2>Approved palette used for validation — 123 swatches</h2>
    <div class="pal" id="pal"></div>
    <div class="note">
      <b>The finished column is palette-locked; the original is not.</b> Both are drawn at the same
      zoom, so banding on the right is the honest cost of fitting 123 swatches.
      Expression tiles come from <b>masked inpainting</b> — everything outside the brow/eye/mouth
      region is pixel-identical to the finished portrait.
      <ul>
        <li>Known source-art issues, not generation failures: the vendor's neutral reads as a grin;
            the stranger's eyes are shadowed; the employee's nametag is blank; corrupted-human is
            the flattest tile.</li>
        <li>Not wired into the game. Nothing here is.</li>
      </ul>
    </div></div>`;
  fetch("../work/deadmall-portrait-union.json").then(r=>r.json()).then(d=>{
    document.getElementById("pal").innerHTML=d.grid.flatMap(r=>r.swatches)
      .map(s=>`<i style="background:${s.hex}" title="${s.hex}"></i>`).join("");
  }).catch(()=>{});
  wire();
}

/* ---------------- tree view ---------------- */
function dirsOf(items){
  const m=new Map();
  for(const it of items){
    const d=it.p.includes("/")?it.p.slice(0,it.p.lastIndexOf("/")):"(root)";
    m.set(d,(m.get(d)||0)+1);
  }
  return m;
}
function sidebar(){
  const m=dirsOf(MAN.items);
  const list=[...m.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
  document.getElementById("dirs").innerHTML =
    `<div class="sect">Featured</div>
     <div class="dir feat ${current==="__featured__"?"on":""}" data-d="__featured__">
       <span>★ portraits (curated)</span></div>
     <div class="sect">Directories — ${list.length}</div>
     <div class="dir ${current==="__all__"?"on":""}" data-d="__all__">
       <span>all images</span><span class="n">${MAN.items.length}</span></div>` +
    list.map(([d,n])=>`<div class="dir ${current===d?"on":""}" data-d="${esc(d)}" title="${esc(d)}">
        <span>${esc(d.replace(/^work\//,""))}</span><span class="n">${n}</span></div>`).join("");
  document.querySelectorAll(".dir").forEach(el=>el.onclick=()=>{
    current=el.dataset.d; sidebar(); render();
  });
}
function render(){
  if(current==="__featured__"){
    where.innerHTML=`<b>Featured</b> — portraits`;
    featured(); return;
  }
  const q=document.getElementById("q").value.trim().toLowerCase();
  filtered = MAN.items.filter(it=>
    (current==="__all__" || it.p.startsWith(current+"/") || (current==="(root)"&&!it.p.includes("/")))
    && (!q || it.p.toLowerCase().includes(q)));
  where.innerHTML = current==="__all__"
    ? `<b>all images</b> — ${filtered.length}${q?` matching “${esc(q)}”`:""}`
    : `<b>${esc(current)}</b> — ${filtered.length}${q?` matching “${esc(q)}”`:""}`;
  shown=0; view.innerHTML=`<div class="grid" id="grid"></div>`;
  more();
}
function more(){
  const g=document.getElementById("grid"); if(!g) return;
  const slice=filtered.slice(shown,shown+CHUNK);
  const html=slice.map(it=>{
    const kb=(it.b/1024).toFixed(it.b<10240?1:0);
    const dim=it.w?`${it.w}×${it.h}`:"?";
    const opaque=it.a===false?' <span class="badge" title="no transparency — outside the runtime alpha contract">opaque</span>':"";
    return `<div class="card">
      <div class="cell"><img loading="lazy" src="../${url(it.p)}"
        data-cap="${esc(it.p)} — ${dim} — ${kb} KB${it.a===false?" — OPAQUE (no alpha)":""}"
        alt=""></div>
      <div class="nm">${esc(it.p.split("/").pop())}</div>
      <div class="mt">${dim} · ${kb} KB${opaque}</div></div>`;
  }).join("");
  g.insertAdjacentHTML("beforeend",html);
  const old=g.querySelector(".more"); if(old) old.remove();
  shown+=slice.length;
  if(shown<filtered.length){
    g.insertAdjacentHTML("beforeend",
      `<div class="more"><button id="mb">show ${Math.min(CHUNK,filtered.length-shown)} more
       (${shown} of ${filtered.length} shown)</button></div>`);
    document.getElementById("mb").onclick=more;
  }
  wire();
}
function wire(){
  view.querySelectorAll("img").forEach(img=>{
    img.onclick=()=>openLB(img.src, img.dataset.cap||img.src.split("/").pop());
  });
}

/* ---------------- controls ---------------- */
document.getElementById("q").addEventListener("input",()=>{ if(current!=="__featured__") render(); });
const root=document.documentElement;
document.querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>{
  root.style.setProperty("--zoom",b.dataset.z);
  document.querySelectorAll("[data-z]").forEach(x=>x.classList.toggle("on",x===b)); });
document.querySelectorAll("[data-bg]").forEach(b=>b.onclick=()=>{
  root.style.setProperty("--bg",b.dataset.bg);
  document.querySelectorAll("[data-bg]").forEach(x=>x.classList.toggle("on",x===b)); });

/* ---------------- boot ---------------- */
fetch("manifest.json").then(r=>r.json()).then(m=>{
  MAN=m;
  document.getElementById("meta").innerHTML =
    `${m.count} images · ${m.aseprite} .aseprite files (not displayable in a browser)`;
  sidebar(); render();
}).catch(e=>{
  document.getElementById("meta").textContent="manifest.json missing — run the builder";
});
</script>
</body>
</html>
